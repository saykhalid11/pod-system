<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>POD System — Proof of Delivery</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0f14; color: #e8ecf4; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; background-image:linear-gradient(rgba(79,142,247,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(79,142,247,.025) 1px,transparent 1px); background-size:36px 36px; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(.4); cursor: pointer; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeSlideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes countUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:#13161e; }
  ::-webkit-scrollbar-thumb { background:#2e3547; border-radius:3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const {
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
  ResponsiveContainer, Cell, PieChart, Pie, RadialBarChart, RadialBar
} = Recharts;

const API_BASE = "";

const C = {
  bg:"#0d0f14", surface:"#13161e", surface2:"#1a1e28",
  border:"#252a38", border2:"#2e3547",
  accent:"#4f8ef7", accent2:"#7c5cfc",
  text:"#e8ecf4", text2:"#8b93a8", text3:"#4a5268",
  green:"#22c55e", orange:"#f59e0b", red:"#ef4444",
};

const STATUS_CFG = {
  completed:{ label:"Completed", color:C.green,  bg:"rgba(34,197,94,.12)",  icon:"✅", desc:"Goods delivered & acknowledged" },
  pending:  { label:"Pending",   color:C.orange, bg:"rgba(245,158,11,.12)", icon:"⏳", desc:"Delivery in progress or scheduled" },
  cancelled:{ label:"Cancelled", color:C.red,    bg:"rgba(239,68,68,.12)",  icon:"❌", desc:"Delivery cancelled or rejected" },
};

function fmt(d){ return d.toISOString().split("T")[0]; }
const today = fmt(new Date());
const fom   = fmt(new Date(new Date().getFullYear(), new Date().getMonth(), 1));

function Badge({ status }){
  if(!status) return <span style={{fontFamily:"monospace",fontSize:11,color:C.text3,background:"rgba(255,255,255,.05)",borderRadius:20,padding:"3px 10px"}}>— Not Set</span>;
  const c = STATUS_CFG[status];
  return <span style={{fontFamily:"monospace",fontSize:11,fontWeight:600,color:c.color,background:c.bg,borderRadius:20,padding:"3px 10px",display:"inline-flex",alignItems:"center",gap:5}}>
    <span style={{width:5,height:5,borderRadius:"50%",background:c.color,display:"inline-block"}}/>{c.label}
  </span>;
}

function Toasts({ list }){
  return <div style={{position:"fixed",bottom:20,right:20,zIndex:9999,display:"flex",flexDirection:"column",gap:8}}>
    {list.map(t=>(
      <div key={t.id} style={{background:C.surface2,border:`1px solid ${t.type==="success"?"rgba(34,197,94,.35)":"rgba(239,68,68,.35)"}`,borderRadius:12,padding:"12px 16px",display:"flex",alignItems:"center",gap:10,minWidth:270,boxShadow:"0 8px 30px rgba(0,0,0,.5)",animation:"toastIn .3s ease"}}>
        <span style={{fontSize:16}}>{t.type==="success"?"✅":"⚠️"}</span>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:C.text}}>{t.title}</div>
          <div style={{fontSize:11,color:C.text2,fontFamily:"monospace"}}>{t.msg}</div>
        </div>
      </div>
    ))}
  </div>;
}

// ── KPI Ring ──────────────────────────────────────────────────────────────
function KPIRing({ pct, color, label, sub }){
  const r = 54, circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
      <div style={{position:"relative",width:140,height:140}}>
        <svg width="140" height="140" style={{transform:"rotate(-90deg)"}}>
          <circle cx="70" cy="70" r={r} fill="none" stroke={C.border2} strokeWidth="10"/>
          <circle cx="70" cy="70" r={r} fill="none" stroke={color} strokeWidth="10"
            strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
            style={{transition:"stroke-dasharray .8s ease"}}/>
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontSize:26,fontWeight:800,color,letterSpacing:-1}}>{pct.toFixed(1)}%</div>
          <div style={{fontFamily:"monospace",fontSize:9,color:C.text3,letterSpacing:.5,textTransform:"uppercase",marginTop:2}}>{label}</div>
        </div>
      </div>
      <div style={{fontFamily:"monospace",fontSize:11,color:C.text2,textAlign:"center"}}>{sub}</div>
    </div>
  );
}

// ── Custom Bar Tooltip ────────────────────────────────────────────────────
function CustomTooltip({ active, payload, label, isValue }){
  if(!active||!payload?.length) return null;
  return (
    <div style={{background:C.surface2,border:`1px solid ${C.border2}`,borderRadius:10,padding:"12px 16px",boxShadow:"0 8px 24px rgba(0,0,0,.4)"}}>
      <div style={{fontFamily:"monospace",fontSize:11,color:C.text3,marginBottom:8}}>{label}</div>
      {payload.map((p,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:p.fill,display:"inline-block"}}/>
          <span style={{fontSize:12,color:C.text2}}>{p.name}:</span>
          <span style={{fontSize:13,fontWeight:700,color:p.fill}}>
            {isValue ? `RM ${Number(p.value).toLocaleString("en-MY",{minimumFractionDigits:2})}` : p.value}
          </span>
        </div>
      ))}
    </div>
  );
}

// ── REPORTS PAGE ──────────────────────────────────────────────────────────
function ReportsPage({ orders, pod, dateFrom, dateTo, loaded }){

  // Compute per-order subtotals and statuses
  const data = useMemo(()=>{
    if(!orders.length) return null;
    let totalCount=0, compCount=0, pendCount=0, cancCount=0, noneCount=0;
    let totalVal=0,   compVal=0,   pendVal=0,   cancVal=0;

    orders.forEach(o => {
      const st  = pod[o.id]?.status || null;
      const val = o.subTotal || o.items.reduce((s,it)=>s+(+it.gross||0),0);
      totalCount++; totalVal += val;
      if(st==="completed"){ compCount++; compVal+=val; }
      else if(st==="pending"){ pendCount++; pendVal+=val; }
      else if(st==="cancelled"){ cancCount++; cancVal+=val; }
      else { noneCount++; }
    });

    const submittedCount = compCount + pendCount + cancCount;
    const kpiCompleted   = totalCount > 0 ? (compCount / totalCount) * 100 : 0;
    const kpiSubmitted   = totalCount > 0 ? (submittedCount / totalCount) * 100 : 0;
    const kpiValue       = totalVal   > 0 ? (compVal / totalVal) * 100 : 0;

    return {
      totalCount, compCount, pendCount, cancCount, noneCount,
      totalVal, compVal, pendVal, cancVal,
      kpiCompleted, kpiSubmitted, kpiValue,
      countBar: [
        { name:"All Orders",  value: totalCount, fill: C.accent },
        { name:"Completed",   value: compCount,  fill: C.green  },
        { name:"Pending",     value: pendCount,  fill: C.orange },
        { name:"Cancelled",   value: cancCount,  fill: C.red    },
        { name:"Not Updated", value: noneCount,  fill: C.text3  },
      ],
      valueBar: [
        { name:"All Orders",  value: +totalVal.toFixed(2), fill: C.accent },
        { name:"Completed",   value: +compVal.toFixed(2),  fill: C.green  },
        { name:"Pending",     value: +pendVal.toFixed(2),  fill: C.orange },
        { name:"Cancelled",   value: +cancVal.toFixed(2),  fill: C.red    },
      ],
      pie: [
        { name:"Completed",   value: compCount,  fill: C.green  },
        { name:"Pending",     value: pendCount,  fill: C.orange },
        { name:"Cancelled",   value: cancCount,  fill: C.red    },
        { name:"Not Updated", value: noneCount,  fill: C.text3  },
      ].filter(x=>x.value>0),
    };
  }, [orders, pod]);

  if(!loaded) return (
    <div style={{padding:80,textAlign:"center"}}>
      <div style={{fontSize:40,opacity:.2}}>📊</div>
      <div style={{fontFamily:"monospace",fontSize:13,color:C.text3,marginTop:12}}>Load orders first to see reports.</div>
    </div>
  );

  if(!data || !orders.length) return (
    <div style={{padding:80,textAlign:"center"}}>
      <div style={{fontSize:40,opacity:.2}}>🔍</div>
      <div style={{fontFamily:"monospace",fontSize:13,color:C.text3,marginTop:12}}>No orders in selected date range.</div>
    </div>
  );

  const fmtVal = v => `RM ${v.toLocaleString("en-MY",{minimumFractionDigits:2})}`;
  const cardStyle = { background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:"20px 24px" };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:20}}>

      {/* Date range label */}
      <div style={{fontFamily:"monospace",fontSize:11,color:C.text3}}>
        Report period: <span style={{color:C.text2}}>{dateFrom} → {dateTo}</span>
        &nbsp;·&nbsp; <span style={{color:C.accent}}>{data.totalCount} orders</span>
        &nbsp;·&nbsp; Total value <span style={{color:C.accent}}>{fmtVal(data.totalVal)}</span>
      </div>

      {/* ── KPI Row ── */}
      <div style={{...cardStyle}}>
        <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:1,textTransform:"uppercase",marginBottom:20}}>
          📈 Key Performance Indicators
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:24}}>
          <KPIRing pct={data.kpiCompleted} color={C.green}  label="Completion Rate"
            sub={`${data.compCount} of ${data.totalCount} orders completed`}/>
          <KPIRing pct={data.kpiSubmitted} color={C.accent} label="Update Rate"
            sub={`${data.compCount+data.pendCount+data.cancCount} of ${data.totalCount} orders updated`}/>
          <KPIRing pct={data.kpiValue}     color={C.accent2} label="Value Delivered"
            sub={`${fmtVal(data.compVal)} of ${fmtVal(data.totalVal)}`}/>
        </div>
      </div>

      {/* ── Summary Cards ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
        {[
          { lbl:"Total Orders",   cnt:data.totalCount, val:data.totalVal, color:C.accent,  icon:"📋" },
          { lbl:"Completed",      cnt:data.compCount,  val:data.compVal,  color:C.green,   icon:"✅" },
          { lbl:"Pending",        cnt:data.pendCount,  val:data.pendVal,  color:C.orange,  icon:"⏳" },
          { lbl:"Cancelled",      cnt:data.cancCount,  val:data.cancVal,  color:C.red,     icon:"❌" },
        ].map(c=>(
          <div key={c.lbl} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:"16px 18px",animation:"countUp .4s ease"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
              <div style={{width:36,height:36,borderRadius:9,background:`${c.color}18`,display:"grid",placeItems:"center",fontSize:16}}>{c.icon}</div>
              <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,textTransform:"uppercase",letterSpacing:.8}}>{c.lbl}</div>
            </div>
            <div style={{fontSize:28,fontWeight:800,letterSpacing:-1,color:c.color,lineHeight:1}}>{c.cnt}</div>
            <div style={{fontFamily:"monospace",fontSize:11,color:C.text2,marginTop:6}}>{fmtVal(c.val)}</div>
          </div>
        ))}
      </div>

      {/* ── Charts Row ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>

        {/* Count Bar Chart */}
        <div style={cardStyle}>
          <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:1,textTransform:"uppercase",marginBottom:16}}>
            📦 Order Count Breakdown
          </div>
          <ResponsiveContainer width="100%" height={240}>
            <BarChart data={data.countBar} barSize={36}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
              <XAxis dataKey="name" tick={{fill:C.text3,fontSize:11,fontFamily:"monospace"}} axisLine={false} tickLine={false}/>
              <YAxis tick={{fill:C.text3,fontSize:11,fontFamily:"monospace"}} axisLine={false} tickLine={false} allowDecimals={false}/>
              <Tooltip content={<CustomTooltip isValue={false}/>} cursor={{fill:"rgba(255,255,255,.03)"}}/>
              <Bar dataKey="value" name="Orders" radius={[6,6,0,0]}>
                {data.countBar.map((e,i)=><Cell key={i} fill={e.fill}/>)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>

        {/* Value Bar Chart */}
        <div style={cardStyle}>
          <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:1,textTransform:"uppercase",marginBottom:16}}>
            💰 Order Value Breakdown (RM)
          </div>
          <ResponsiveContainer width="100%" height={240}>
            <BarChart data={data.valueBar} barSize={36}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
              <XAxis dataKey="name" tick={{fill:C.text3,fontSize:11,fontFamily:"monospace"}} axisLine={false} tickLine={false}/>
              <YAxis tick={{fill:C.text3,fontSize:11,fontFamily:"monospace"}} axisLine={false} tickLine={false}
                tickFormatter={v=>`RM ${(v/1000).toFixed(0)}k`}/>
              <Tooltip content={<CustomTooltip isValue={true}/>} cursor={{fill:"rgba(255,255,255,.03)"}}/>
              <Bar dataKey="value" name="Value" radius={[6,6,0,0]}>
                {data.valueBar.map((e,i)=><Cell key={i} fill={e.fill}/>)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* ── Pie + KPI Table Row ── */}
      <div style={{display:"grid",gridTemplateColumns:"340px 1fr",gap:16}}>

        {/* Pie Chart */}
        <div style={cardStyle}>
          <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:1,textTransform:"uppercase",marginBottom:16}}>
            🥧 Status Distribution
          </div>
          <ResponsiveContainer width="100%" height={200}>
            <PieChart>
              <Pie data={data.pie} cx="50%" cy="50%" innerRadius={55} outerRadius={85}
                dataKey="value" paddingAngle={3}>
                {data.pie.map((e,i)=><Cell key={i} fill={e.fill}/>)}
              </Pie>
              <Tooltip content={<CustomTooltip isValue={false}/>}/>
            </PieChart>
          </ResponsiveContainer>
          <div style={{display:"flex",flexWrap:"wrap",gap:"8px 14px",marginTop:8,justifyContent:"center"}}>
            {data.pie.map((e,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:5,fontFamily:"monospace",fontSize:11,color:C.text2}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:e.fill,display:"inline-block"}}/>
                {e.name} ({e.value})
              </div>
            ))}
          </div>
        </div>

        {/* KPI Detail Table */}
        <div style={cardStyle}>
          <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:1,textTransform:"uppercase",marginBottom:16}}>
            🎯 Performance Summary Table
          </div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:C.surface2}}>
                {["Metric","Count","Value (RM)","% of Total Count","% of Total Value"].map(h=>(
                  <th key={h} style={{padding:"8px 12px",textAlign:"left",fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:.8,textTransform:"uppercase",borderBottom:`1px solid ${C.border}`,fontWeight:500}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                { lbl:"✅ Completed", cnt:data.compCount, val:data.compVal, color:C.green  },
                { lbl:"⏳ Pending",   cnt:data.pendCount, val:data.pendVal, color:C.orange },
                { lbl:"❌ Cancelled", cnt:data.cancCount, val:data.cancVal, color:C.red    },
                { lbl:"— Not Updated",cnt:data.noneCount,val:0,            color:C.text3  },
              ].map((r,i)=>{
                const cntPct = data.totalCount>0?(r.cnt/data.totalCount*100).toFixed(1):0;
                const valPct = data.totalVal>0?(r.val/data.totalVal*100).toFixed(1):0;
                return (
                  <tr key={i} style={{borderBottom:`1px solid rgba(255,255,255,.04)`}}>
                    <td style={{padding:"10px 12px",fontWeight:600,color:r.color}}>{r.lbl}</td>
                    <td style={{padding:"10px 12px",fontFamily:"monospace",fontSize:13,fontWeight:700,color:r.color}}>{r.cnt}</td>
                    <td style={{padding:"10px 12px",fontFamily:"monospace",fontSize:12}}>{fmtVal(r.val)}</td>
                    <td style={{padding:"10px 12px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div style={{flex:1,height:6,background:C.border,borderRadius:3,overflow:"hidden"}}>
                          <div style={{width:`${cntPct}%`,height:"100%",background:r.color,borderRadius:3,transition:"width .6s ease"}}/>
                        </div>
                        <span style={{fontFamily:"monospace",fontSize:11,color:r.color,minWidth:36}}>{cntPct}%</span>
                      </div>
                    </td>
                    <td style={{padding:"10px 12px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div style={{flex:1,height:6,background:C.border,borderRadius:3,overflow:"hidden"}}>
                          <div style={{width:`${valPct}%`,height:"100%",background:r.color,borderRadius:3,transition:"width .6s ease"}}/>
                        </div>
                        <span style={{fontFamily:"monospace",fontSize:11,color:r.color,minWidth:36}}>{valPct}%</span>
                      </div>
                    </td>
                  </tr>
                );
              })}
              <tr style={{background:C.surface2}}>
                <td style={{padding:"10px 12px",fontWeight:700,color:C.accent}}>📋 TOTAL</td>
                <td style={{padding:"10px 12px",fontFamily:"monospace",fontWeight:800,color:C.accent}}>{data.totalCount}</td>
                <td style={{padding:"10px 12px",fontFamily:"monospace",fontWeight:700,color:C.accent}}>{fmtVal(data.totalVal)}</td>
                <td style={{padding:"10px 12px",fontFamily:"monospace",color:C.text3}}>100%</td>
                <td style={{padding:"10px 12px",fontFamily:"monospace",color:C.text3}}>100%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  );
}

// ── ORDER DETAIL ──────────────────────────────────────────────────────────
function OrderDetail({ order, st, onStatus, onComment, onSubmit }){
  const { status, comment, submitted, submitting } = st;
  const itemsGross = order.items.reduce((s,it)=>s+(+it.gross||0),0);
  const sst        = order.sstAmount || 0;
  const subTotal   = order.subTotal  || (itemsGross + sst);

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:20,padding:"20px 20px 20px 58px",background:"rgba(0,0,0,.22)",borderTop:`1px solid ${C.border}`,animation:"fadeSlideIn .2s ease"}}>
      <div>
        <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>
          Line Items — {order.customer}
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:480}}>
            <thead>
              <tr style={{background:C.surface2}}>
                {["Description","Unit","Qty","Rate (RM)","Gross (RM)"].map((h,i)=>(
                  <th key={h} style={{padding:"7px 10px",textAlign:i>=2?"right":"left",fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:.8,textTransform:"uppercase",borderBottom:`1px solid ${C.border}`,fontWeight:500,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {order.items.map((it,i)=>(
                <tr key={i} style={{borderBottom:`1px solid rgba(255,255,255,.03)`}}>
                  <td style={{padding:"9px 10px",color:C.text}}>{it.name}</td>
                  <td style={{padding:"9px 10px",fontFamily:"monospace",fontSize:12,color:C.text2}}>{it.unit}</td>
                  <td style={{padding:"9px 10px",fontFamily:"monospace",fontSize:12,textAlign:"right"}}>{(+it.qty).toLocaleString()}</td>
                  <td style={{padding:"9px 10px",fontFamily:"monospace",fontSize:12,textAlign:"right"}}>{(+it.rate).toFixed(2)}</td>
                  <td style={{padding:"9px 10px",fontFamily:"monospace",fontSize:13,fontWeight:600,textAlign:"right"}}>RM {(+it.gross).toFixed(2)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr><td colSpan={4} style={{padding:"7px 10px",textAlign:"right",fontFamily:"monospace",fontSize:11,color:C.text3,borderTop:`1px solid ${C.border}`}}>Items Gross</td>
                  <td style={{padding:"7px 10px",fontFamily:"monospace",textAlign:"right",borderTop:`1px solid ${C.border}`}}>RM {itemsGross.toFixed(2)}</td></tr>
              <tr><td colSpan={4} style={{padding:"7px 10px",textAlign:"right",fontFamily:"monospace",fontSize:11,color:C.text3}}>SST Amount</td>
                  <td style={{padding:"7px 10px",fontFamily:"monospace",textAlign:"right"}}>RM {sst.toFixed(2)}</td></tr>
              <tr><td colSpan={4} style={{padding:"7px 10px",textAlign:"right",fontFamily:"monospace",fontSize:13,color:C.accent,fontWeight:700}}>SUB TOTAL</td>
                  <td style={{padding:"7px 10px",fontFamily:"monospace",fontSize:14,fontWeight:700,textAlign:"right",color:C.accent}}>RM {subTotal.toFixed(2)}</td></tr>
            </tfoot>
          </table>
        </div>
        <div style={{marginTop:10,padding:"9px 12px",background:"rgba(255,255,255,.02)",borderRadius:8,border:`1px solid ${C.border}`}}>
          <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:.8,marginBottom:3}}>SHIP TO</div>
          <div style={{fontSize:13,color:C.text2}}>{order.address||"—"}</div>
        </div>
      </div>
      <div style={{background:C.surface2,border:`1px solid ${C.border2}`,borderRadius:14,padding:18,display:"flex",flexDirection:"column",gap:14,alignSelf:"start",position:"sticky",top:16}}>
        <div>
          <div style={{fontSize:13,fontWeight:700}}>🚚 Delivery Status Update</div>
          <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,marginTop:2}}>POD — {order.id}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {Object.entries(STATUS_CFG).map(([key,cfg])=>{
            const sel = status===key;
            return <div key={key} onClick={()=>!submitted&&onStatus(key)}
              style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:9,border:`1px solid ${sel?cfg.color:C.border}`,background:sel?cfg.bg:"transparent",cursor:submitted?"not-allowed":"pointer",opacity:submitted?.65:1,transition:"all .15s",userSelect:"none"}}>
              <div style={{width:15,height:15,borderRadius:"50%",border:`2px solid ${sel?cfg.color:C.border2}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {sel&&<div style={{width:6,height:6,borderRadius:"50%",background:cfg.color}}/>}
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:600}}>{cfg.icon} {cfg.label}</div>
                <div style={{fontSize:11,color:C.text3}}>{cfg.desc}</div>
              </div>
            </div>;
          })}
        </div>
        <div>
          <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:.8,marginBottom:5}}>REMARKS / NOTES</div>
          <textarea value={comment} onChange={e=>!submitted&&onComment(e.target.value)} disabled={submitted}
            placeholder="e.g. Received by John at 2:30pm..." rows={3}
            style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,fontFamily:"monospace",fontSize:12,padding:"9px 11px",borderRadius:8,width:"100%",resize:"none",outline:"none",lineHeight:1.5,opacity:submitted?.6:1}}/>
        </div>
        <button disabled={!status||submitted||submitting} onClick={onSubmit}
          style={{width:"100%",padding:11,borderRadius:9,fontWeight:700,fontSize:14,
            cursor:(!status||submitted||submitting)?"not-allowed":"pointer",
            border:submitted?`1px solid ${C.green}`:"none",
            background:submitted?"rgba(34,197,94,.1)":submitting?C.surface:!status?C.surface:"linear-gradient(135deg,#4f8ef7,#7c5cfc)",
            color:submitted?C.green:(!status||submitting)?C.text3:"#fff",
            boxShadow:(status&&!submitted&&!submitting)?"0 4px 14px rgba(79,142,247,.28)":"none",
            transition:"all .2s"}}>
          {submitted?"✅ Submitted":submitting?"⌛ Submitting…":status?"↑ Submit POD Update":"Select a Status First"}
        </button>
        {submitted&&<div style={{textAlign:"center",fontFamily:"monospace",fontSize:10,color:C.green,marginTop:-8}}>Saved to database ✓</div>}
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App(){
  const [activeTab,  setActiveTab]  = useState("orders");
  const [dateFrom,   setDateFrom]   = useState(fom);
  const [dateTo,     setDateTo]     = useState(today);
  const [custFilter, setCustFilter] = useState("");
  const [orders,     setOrders]     = useState([]);
  const [loading,    setLoading]    = useState(false);
  const [loaded,     setLoaded]     = useState(false);
  const [error,      setError]      = useState("");
  const [expanded,   setExpanded]   = useState({});
  const [pod,        setPod]        = useState({});
  const [toasts,     setToasts]     = useState([]);

  function addToast(type, title, msg){
    const id = Date.now();
    setToasts(t=>[...t,{id,type,title,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 3500);
  }

  async function loadOrders(){
    if(!dateFrom||!dateTo){ addToast("error","⚠️ Required","Select both dates."); return; }
    if(dateFrom>dateTo){ addToast("error","⚠️ Invalid","From must be before To."); return; }
    setLoading(true); setLoaded(false); setError(""); setExpanded({}); setOrders([]);
    try{
      const url = `${API_BASE}/api/sales-orders?from=${dateFrom}&to=${dateTo}&customer=${encodeURIComponent(custFilter)}`;
      const res = await fetch(url);
      if(!res.ok){ const e=await res.json(); throw new Error(e.error||`HTTP ${res.status}`); }
      const data = await res.json();
      setOrders(data);
      const s={};
      data.forEach(o=>{ s[o.id]=pod[o.id]||{status:null,comment:"",submitted:false,submitting:false}; });
      setPod(s); setLoaded(true);
      addToast("success","✅ Orders Loaded",`${data.length} order(s) retrieved.`);
    }catch(err){
      setError(err.message);
      addToast("error","❌ Load Failed", err.message);
    }finally{ setLoading(false); }
  }

  async function submitPOD(id){
    const st=pod[id];
    if(!st?.status||st.submitted) return;
    setPod(p=>({...p,[id]:{...p[id],submitting:true}}));
    try{
      const res = await fetch(`${API_BASE}/api/delivery-status`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ salesOrderNo:id, deliveryStatus:st.status, remarks:st.comment||"", updatedBy:"POD_USER" })
      });
      if(!res.ok){ const e=await res.json(); throw new Error(e.error||`HTTP ${res.status}`); }
      setPod(p=>({...p,[id]:{...p[id],submitting:false,submitted:true}}));
      addToast("success","✅ POD Saved",`${id} marked as ${st.status}.`);
    }catch(err){
      setPod(p=>({...p,[id]:{...p[id],submitting:false}}));
      addToast("error","❌ Failed", err.message);
    }
  }

  const stats = useMemo(()=>{
    const s={total:orders.length,completed:0,pending:0,cancelled:0};
    orders.forEach(o=>{ const v=pod[o.id]?.status; if(v) s[v]++; });
    return s;
  },[orders,pod]);

  const inputStyle = { background:C.surface2, border:`1px solid ${C.border2}`, color:C.text, fontFamily:"monospace", fontSize:13, padding:"8px 11px", borderRadius:8, outline:"none" };

  const tabStyle = (active) => ({
    padding:"9px 20px", borderRadius:9, fontWeight:700, fontSize:13, cursor:"pointer", border:"none",
    background: active ? "linear-gradient(135deg,#4f8ef7,#7c5cfc)" : C.surface2,
    color: active ? "#fff" : C.text2,
    boxShadow: active ? "0 4px 14px rgba(79,142,247,.25)" : "none",
    transition:"all .2s"
  });

  return (
    <div style={{position:"relative",maxWidth:1280,margin:"0 auto",padding:"0 20px 60px"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"24px 0 20px",borderBottom:`1px solid ${C.border}`,marginBottom:22}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:42,height:42,borderRadius:11,background:"linear-gradient(135deg,#4f8ef7,#7c5cfc)",display:"grid",placeItems:"center",fontSize:20,flexShrink:0}}>📦</div>
          <div>
            <div style={{fontSize:20,fontWeight:800,letterSpacing:-.5}}>POD <span style={{color:C.accent}}>System</span></div>
            <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,marginTop:1}}>Proof of Delivery Portal — Focus8010</div>
          </div>
        </div>
        <div style={{fontFamily:"monospace",fontSize:11,color:C.text3,textAlign:"right"}}>
          <span style={{color:C.text2,display:"block"}}>{new Date().toDateString()}</span>
          Sales Order Management
        </div>
      </div>

      {/* Filter Bar */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px 20px",display:"flex",alignItems:"flex-end",gap:14,flexWrap:"wrap",marginBottom:20}}>
        {[["From Date",dateFrom,setDateFrom],["To Date",dateTo,setDateTo]].map(([lbl,val,set])=>(
          <div key={lbl} style={{display:"flex",flexDirection:"column",gap:5}}>
            <span style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:1,textTransform:"uppercase"}}>{lbl}</span>
            <input type="date" value={val} onChange={e=>set(e.target.value)} style={{...inputStyle,minWidth:145,cursor:"pointer"}}/>
          </div>
        ))}
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <span style={{fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:1,textTransform:"uppercase"}}>Customer</span>
          <input type="text" value={custFilter} onChange={e=>setCustFilter(e.target.value)}
            placeholder="Filter by customer…" onKeyDown={e=>e.key==="Enter"&&loadOrders()}
            style={{...inputStyle,minWidth:200}}/>
        </div>
        <div style={{display:"flex",gap:9,marginLeft:"auto"}}>
          <button onClick={()=>{setDateFrom(fom);setDateTo(today);setCustFilter("");}}
            style={{padding:"8px 16px",borderRadius:8,background:C.surface2,border:`1px solid ${C.border2}`,color:C.text2,fontWeight:600,fontSize:13,cursor:"pointer"}}>↺ Reset</button>
          <button onClick={loadOrders} disabled={loading}
            style={{padding:"8px 22px",borderRadius:8,background:"linear-gradient(135deg,#4f8ef7,#7c5cfc)",color:"#fff",fontWeight:700,fontSize:13,cursor:loading?"wait":"pointer",border:"none",boxShadow:"0 4px 14px rgba(79,142,247,.28)",opacity:loading?.7:1}}>
            {loading?"⌛ Loading…":"⚡ Load Orders"}
          </button>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
        {[["total","📋",C.accent,"TOTAL ORDERS"],["completed","✅",C.green,"COMPLETED"],["pending","⏳",C.orange,"PENDING"],["cancelled","❌",C.red,"CANCELLED"]].map(([k,ico,clr,lbl])=>(
          <div key={k} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:38,height:38,borderRadius:9,background:`${clr}18`,display:"grid",placeItems:"center",fontSize:17,flexShrink:0}}>{ico}</div>
            <div>
              <div style={{fontSize:25,fontWeight:800,letterSpacing:-1,color:k==="total"?C.text:clr}}>{loaded?stats[k]:"—"}</div>
              <div style={{fontFamily:"monospace",fontSize:10,color:C.text3,marginTop:1}}>{lbl}</div>
            </div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        <button style={tabStyle(activeTab==="orders")} onClick={()=>setActiveTab("orders")}>📋 Sales Orders</button>
        <button style={tabStyle(activeTab==="reports")} onClick={()=>setActiveTab("reports")}>📊 Reports & KPI</button>
      </div>

      {/* ── ORDERS TAB ── */}
      {activeTab==="orders" && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 18px",borderBottom:`1px solid ${C.border}`}}>
            <div style={{fontFamily:"monospace",fontSize:12,color:C.text2}}>
              {error ? <span style={{color:C.red}}>⚠️ {error}</span>
                : loaded ? <span>Found <strong style={{color:C.accent}}>{orders.length}</strong> order(s) · {dateFrom} → {dateTo}</span>
                : "Select a date range and click ⚡ Load Orders"}
            </div>
            <div style={{fontFamily:"monospace",fontSize:10,color:C.text3}}>↕ Click any row to expand</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"38px 150px 100px 1fr 120px 70px 180px",padding:"9px 18px",background:C.surface2,borderBottom:`1px solid ${C.border}`}}>
            {["","ORDER NO.","DATE","CUSTOMER","GROSS (RM)","ITEMS","STATUS"].map((h,i)=>(
              <div key={i} style={{padding:"0 8px",fontFamily:"monospace",fontSize:10,color:C.text3,letterSpacing:.9,textTransform:"uppercase",textAlign:i>=4?"center":"left"}}>{h}</div>
            ))}
          </div>
          {loading ? (
            <div style={{padding:56,textAlign:"center",fontFamily:"monospace",fontSize:13,color:C.text3}}>
              <span style={{display:"inline-block",width:18,height:18,border:`2px solid ${C.border}`,borderTopColor:C.accent,borderRadius:"50%",animation:"spin .7s linear infinite",marginRight:10,verticalAlign:"middle"}}/>
              Querying SQL Server…
            </div>
          ) : !loaded&&!error ? (
            <div style={{padding:56,textAlign:"center"}}>
              <div style={{fontSize:34,opacity:.2}}>🗂️</div>
              <div style={{fontFamily:"monospace",fontSize:13,color:C.text3,marginTop:10}}>No orders loaded yet.</div>
            </div>
          ) : error ? (
            <div style={{padding:40,textAlign:"center"}}>
              <div style={{fontSize:34,opacity:.3}}>⚠️</div>
              <div style={{fontFamily:"monospace",fontSize:13,color:C.red,marginTop:10}}>{error}</div>
            </div>
          ) : orders.length===0 ? (
            <div style={{padding:56,textAlign:"center"}}>
              <div style={{fontSize:34,opacity:.2}}>🔍</div>
              <div style={{fontFamily:"monospace",fontSize:13,color:C.text3,marginTop:10}}>No orders found.</div>
            </div>
          ) : orders.map(o=>{
            const gross = o.items.reduce((s,it)=>s+(+it.gross||0),0);
            const open  = !!expanded[o.id];
            const st    = pod[o.id]||{};
            return (
              <div key={o.id} style={{borderBottom:`1px solid ${C.border}`}}>
                <div onClick={()=>setExpanded(e=>({...e,[o.id]:!e[o.id]}))}
                  style={{display:"grid",gridTemplateColumns:"38px 150px 100px 1fr 120px 70px 180px",padding:"0 18px",minHeight:52,alignItems:"center",cursor:"pointer",background:open?"rgba(79,142,247,.05)":"transparent",transition:"background .15s"}}>
                  <div style={{padding:"0 8px"}}>
                    <div style={{width:20,height:20,borderRadius:6,background:open?"rgba(79,142,247,.12)":C.surface2,border:`1px solid ${open?C.accent:C.border}`,display:"grid",placeItems:"center",fontSize:12,color:open?C.accent:C.text3,transition:"all .2s",transform:open?"rotate(90deg)":"none"}}>›</div>
                  </div>
                  <div style={{padding:"0 8px",fontFamily:"monospace",fontSize:12,color:C.accent,fontWeight:500}}>{o.id}</div>
                  <div style={{padding:"0 8px",fontFamily:"monospace",fontSize:12,color:C.text2}}>{o.date}</div>
                  <div style={{padding:"0 8px",fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{o.customer}</div>
                  <div style={{padding:"0 8px",fontFamily:"monospace",fontSize:13,fontWeight:600,textAlign:"center"}}>RM {gross.toFixed(2)}</div>
                  <div style={{padding:"0 8px",fontFamily:"monospace",fontSize:12,color:C.text2,textAlign:"center"}}>{o.items.length}</div>
                  <div style={{padding:"0 8px",textAlign:"center"}}><Badge status={st.status}/></div>
                </div>
                {open&&(
                  <OrderDetail order={o} st={st}
                    onStatus={s=>setPod(p=>({...p,[o.id]:{...p[o.id],status:s}}))}
                    onComment={c=>setPod(p=>({...p,[o.id]:{...p[o.id],comment:c}}))}
                    onSubmit={()=>submitPOD(o.id)}/>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ── REPORTS TAB ── */}
      {activeTab==="reports" && (
        <ReportsPage orders={orders} pod={pod} dateFrom={dateFrom} dateTo={dateTo} loaded={loaded}/>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
